name: Deploy GitHub Pages

on:
  push:
    branches: [feature/visualizacao-d3-duckdb]
    paths: ["app/public/**", "app/src/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # index.html referencia ../src/main.js e ../src/styles.css, caminho
      # relativo que só resolve certo quando a URL de index.html tem pelo
      # menos um nível de pasta antes da raiz do site (ex.: .../app/public/
      # servido a partir de um diretório acima). No GitHub Pages, o projeto
      # é publicado NA raiz do site — então "../" tenta subir acima da raiz
      # inteira (vira .../main.js no domínio github.io, fora da pasta do
      # projeto) e dá 404. Aqui copiamos src/ como irmã de index.html e
      # reescrevemos só essa cópia publicada para "src/..." (sem "../"),
      # sem tocar no index.html real do repositório — o fluxo local continua
      # intacto.
      - name: Montar site (public/ + src/ como irmãos, com caminhos corrigidos)
        run: |
          mkdir -p _site
          cp -r app/public/. _site/
          cp -r app/src _site/src
          sed -i 's@\.\./src/@src/@g' _site/index.html

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
