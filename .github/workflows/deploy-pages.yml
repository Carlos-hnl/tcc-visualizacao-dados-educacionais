name: Deploy GitHub Pages

on:
  push:
    branches: [feature/visualizacao-d3-duckdb]
    paths: ["app/public/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato (app/public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
